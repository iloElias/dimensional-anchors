name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build and GameTests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run GameTests
        run: ./gradlew --no-daemon build runGameTestServer
